- name: Deploy dask-worker systemd service
  become: true
  ansible.builtin.template:
    src: dask-worker.service.j2
    dest: /etc/systemd/system/dask-worker.service
    mode: '0644'
  notify: restart dask-worker

- name: Reload systemd
  become: true
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start dask-worker
  become: true
  ansible.builtin.systemd:
    name: dask-worker
    enabled: true
    state: started